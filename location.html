{% load static %}

<!DOCTYPE html>
<html>

<head>
    <title>Farm Location</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
<div class="container">
    <h1>📍 Farm Location</h1>
    <p class="subtitle">Your farm's live GPS location</p>
    <div id="status" class="loading-container">
        <div class="loader"></div>
        <p class="loading-text">📍 Detecting your farm location...</p>
    </div>
    <br>
    <a href="/" class="open-btn">← Back to Dashboard</a>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
<script src="{% static 'js/location.js' %}"></script>

</body>

</html>
